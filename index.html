<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>왼손오른손 리듬감 테스트</title>
<style>
  :root {
    --bg-main: #141518;
    --card-bg: #1f2128;
    --card-inner: #17181f;
    --accent-orange: #ff9f0a;
    --accent-left: #0a84ff;   /* 왼쪽: 파란색 */
    --accent-right: #30d158;  /* 오른쪽: 초록색 */
    --accent-miss: #ff453a;   /* 미스: 빨간색 */
    --text-primary: #f2f2f7;
    --text-muted: #8e8e93;
    --border-color: #2e303c;
    --gold: #ffd700;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Apple SD Gothic Neo", sans-serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: env(safe-area-inset-top, 12px) env(safe-area-inset-right, 12px) env(safe-area-inset-bottom, 12px) env(safe-area-inset-left, 12px);
  }

  .device-frame {
    width: 100%;
    max-width: 540px;
    background: var(--card-bg);
    border: 1.5px solid var(--border-color);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  @keyframes flash-normal {
    0% {
      border-color: rgba(255, 215, 0, 0.95);
      box-shadow: 0 0 28px rgba(255, 215, 0, 0.5), 0 16px 36px rgba(0, 0, 0, 0.6);
    }
    100% {
      border-color: var(--border-color);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }
  }

  @keyframes flash-accent {
    0% {
      border-color: rgba(255, 159, 10, 1.0);
      box-shadow: 0 0 36px rgba(255, 159, 10, 0.65), 0 16px 36px rgba(0, 0, 0, 0.6);
    }
    100% {
      border-color: var(--border-color);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }
  }

  .guide-banner {
    background: rgba(255, 159, 10, 0.08);
    border: 1px solid rgba(255, 159, 10, 0.25);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 11px;
    color: #ffc266;
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.4;
    min-height: 36px;
    transition: opacity 0.2s ease;
  }

  .level-section { display: flex; flex-direction: column; gap: 6px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; }
  .level-group-label { font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.5px; }
  .stars-total-badge { color: var(--gold); font-size: 12px; font-weight: 800; }
  .reset-link { color: var(--text-muted); font-size: 10px; text-decoration: underline; cursor: pointer; }

  .chapter-nav {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
    background: var(--card-inner);
    padding: 3px;
    border-radius: 10px;
  }
  .chapter-tab {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 6px 0;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .chapter-tab.active {
    background: #2c2f3d;
    color: var(--accent-orange);
  }

  .level-nav {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    background: var(--card-inner);
    padding: 5px;
    border-radius: 12px;
  }
  .level-tab {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    padding: 6px 0 4px 0;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .level-tab.active {
    background: var(--accent-orange);
    color: #000;
    box-shadow: 0 2px 6px rgba(255, 159, 10, 0.3);
  }
  .level-tab.locked {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .tab-stars { font-size: 8px; line-height: 8px; color: var(--gold); }
  .level-tab.active .tab-stars { color: #000; }

  .header { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
  .title-wrap h1 { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .badge {
    background: rgba(255, 159, 10, 0.15);
    color: var(--accent-orange);
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
  }
  .title-wrap p { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }

  .controls-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .ctrl-card {
    background: var(--card-inner);
    border-radius: 12px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .ctrl-label { font-size: 11.5px; font-weight: 700; font-family: ui-monospace, monospace; color: var(--accent-orange); }
  .ctrl-btns { display: flex; gap: 3px; align-items: center; }
  .btn-step {
    background: #2b2d38;
    border: 1px solid var(--border-color);
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .practice-badge {
    background: rgba(255, 69, 58, 0.2);
    color: #ff453a;
    font-size: 9px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 4px;
    margin-left: 4px;
  }

  .btn-demo-card {
    background: var(--card-inner);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    touch-action: manipulation;
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 700;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-demo-card:active { transform: scale(0.98); }
  .btn-demo-card.playing {
    background: #2a2016;
    border-color: var(--accent-orange);
    color: var(--accent-orange);
  }

  .sequencer-card {
    background: var(--card-inner);
    border-radius: 14px;
    padding: 10px;
  }
  .sequencer-header {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .step-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
  }
  .step-node {
    background: #242630;
    border-radius: 8px;
    padding: 8px 0;
    text-align: center;
    border: 1.5px solid transparent;
    transition: transform 0.05s, background 0.08s;
  }
  .step-node .note-hand { font-size: 13px; font-weight: 800; }
  .step-node .note-sub { font-size: 8.5px; color: var(--text-muted); margin-top: 2px; }
  .step-node.hand-R { color: var(--accent-right); }
  .step-node.hand-L { color: var(--accent-left); }
  .step-node.hand-rest { color: #444857; }

  .step-node.is-long {
    background: #332512;
    border: 1.5px solid var(--accent-orange);
    color: #ffc266;
    box-shadow: 0 0 10px rgba(255, 159, 10, 0.25);
  }
  .step-node.is-long .note-hand {
    color: #ffc266;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }

  .step-node.active {
    background: #313543;
    transform: translateY(-2px);
  }
  .step-node.active.hand-R { border-color: var(--accent-right); }
  .step-node.active.hand-L { border-color: var(--accent-left); }
  .step-node.active.hand-rest { border-color: #555c70; }
  .step-node.active.is-long {
    background: var(--accent-orange);
    color: #000;
    box-shadow: 0 0 16px rgba(255, 159, 10, 0.6);
  }
  .step-node.active.is-long .note-hand { color: #000; }

  .feedback-box {
    text-align: center;
    min-height: 20px;
    font-size: 14px;
    font-weight: 800;
  }

  .pad-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 125px; }
  .touch-pad {
    position: relative;
